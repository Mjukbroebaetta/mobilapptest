<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geoposisjon og Vibrasjon</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
        }

        #resultat {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <h1>Geoposisjon og Vibrasjon</h1>

    <button onclick="hentPosisjon()">Geoposisjon</button>
    <button onclick="vibrer()">Vibrer</button>

    <div id="resultat">
        Trykk på en knapp.
    </div>

    <script>
        function hentPosisjon() {
            const resultat = document.getElementById("resultat");

            if (!navigator.geolocation) {
                resultat.textContent =
                    "Geolokasjon støttes ikke av nettleseren.";
                return;
            }

            resultat.textContent = "Henter posisjon...";

            navigator.geolocation.getCurrentPosition(
                function(posisjon) {
                    resultat.innerHTML = `
                        <p><strong>Breddegrad:</strong> ${posisjon.coords.latitude}</p>
                        <p><strong>Lengdegrad:</strong> ${posisjon.coords.longitude}</p>
                        <p><strong>Nøyaktighet:</strong> ${Math.round(posisjon.coords.accuracy)} meter</p>
                    `;
                },
                function(feil) {
                    resultat.textContent =
                        "Kunne ikke hente posisjon: " + feil.message;
                }
            );
        }

        function vibrer() {
            if (!navigator.vibrate) {
                alert("Vibrasjon støttes ikke av denne nettleseren/enheten.");
                return;
            }

            // Lengst mulig vibrasjonsmønster nettleseren tillater.
            navigator.vibrate([
                1000, 200,
                1000, 200,
                1000, 200,
                1000
            ]);
        }
    </script>

</body>
</html>
